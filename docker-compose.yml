# ============================================================
# SaarlandBot Lite Edition – Installationsdatei
# ============================================================
# Vollversion mit allen Features: https://saarlandbot.de
# ============================================================
#
# Verwendung:
#   1. cp .env.example .env  (und .env befüllen)
#   2. docker compose up -d
#
# Voraussetzungen:
#   - Docker >= 24.0
#   - Docker Compose v2  (docker compose, nicht docker-compose)
# ============================================================

services:
  # ── PostgreSQL Datenbank ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: saarbot-lite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bot_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-saarlandbot_lite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot-internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-bot_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Sessions & Caching) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: saarbot-lite-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --protected-mode yes
      --bind 0.0.0.0
      --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - bot-internal
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Discord Bot ───────────────────────────────────────────────
  bot:
    image: ghcr.io/saarlandletsplay/saarbot-lite/bot:latest
    container_name: saarbot-lite-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-bot_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-saarlandbot_lite}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot-internal
    volumes:
      - bot_logs:/app/logs

  # ── Backend API ───────────────────────────────────────────────
  backend:
    image: ghcr.io/saarlandletsplay/saarbot-lite/backend:latest
    container_name: saarbot-lite-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-bot_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-saarlandbot_lite}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BACKEND_PORT: 3001
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot-internal
      - bot-external
    volumes:
      - backend_logs:/app/logs

  # ── Web Dashboard ─────────────────────────────────────────────
  web:
    image: ghcr.io/saarlandletsplay/saarbot-lite/web:latest
    container_name: saarbot-lite-web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - bot-external

networks:
  bot-internal:
    internal: true
  bot-external:

volumes:
  postgres_data:
  redis_data:
  bot_logs:
  backend_logs:
